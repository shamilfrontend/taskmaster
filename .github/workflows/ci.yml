name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client
        run: npm ci
        working-directory: client

      - name: Install server
        run: npm ci
        working-directory: server

      - name: Lint client
        run: npm run lint
        working-directory: client

      - name: Lint server
        run: npm run lint
        working-directory: server
